name: Download stats
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
  release: { types: [published] }
permissions: { contents: write, actions: write }
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Write site/stats.json
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 .github/scripts/make_stats.py
      - name: Commit and deploy if the number changed
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add site/stats.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update download count"
          git push origin main
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
