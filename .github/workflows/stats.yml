name: Download stats
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
  release: { types: [published] }
permissions: { contents: write, actions: write }
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Write site/stats.json
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 .github/scripts/make_stats.py
      - name: Commit and deploy if the number changed
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add site/stats.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update download count"
          # main may move meanwhile (the release workflow commits at the same moment): rebase and retry, never fail
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then ok=1; break; fi
            sleep $((i * 4))
          done
          if [ "$ok" != "1" ]; then echo "Could not push the stats this time; the next hourly run will retry"; exit 0; fi
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
