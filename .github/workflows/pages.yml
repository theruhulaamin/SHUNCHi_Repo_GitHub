name: Deploy website
on:
  push:
    branches: [main]
    paths: ["site/**", "content/**", "tools/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Write idea-inbox config (token comes from the repository secret IDEAS_TOKEN)
        env:
          IDEAS_TOKEN: ${{ secrets.IDEAS_TOKEN }}
        run: |
          python3 -I - <<'EOF'
          import json, os
          t = os.environ.get("IDEAS_TOKEN", "").strip()
          cfg = {"repo": "theruhulaamin/shunchi-ideas", "token": t} if t else {}
          open("site/data/ideas-config.json", "w").write(json.dumps(cfg))
          print("ideas config:", "enabled" if t else "NOT set (IDEAS_TOKEN secret missing)")
          EOF
      - name: Build pages (blog, software pages, sitemap, feed)
        run: |
          pip install markdown
          python3 -I tools/gen_pages.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
