<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHUNCHi · Live Popup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Hind+Siliguri:wght@500&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fa;--ink:#0f172a;--muted:#6b7280;--blue:#3b82f6;
--card:rgba(14,14,16,.9);--cardink:#fff;--cardmuted:#a0a0a8;--cardfaint:#6e6e76;--bar:rgba(255,255,255,.22);--line:rgba(255,255,255,.1);--edge:rgba(255,255,255,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101114;--ink:#f3f4f6;--muted:#9ca3af}}
:root[data-theme="dark"]{--bg:#101114;--ink:#f3f4f6;--muted:#9ca3af}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,"Hind Siliguri",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px}
.card[data-card="light"]{--card:rgba(255,255,255,.94);--cardink:#0f172a;--cardmuted:#64748b;--cardfaint:#94a3b8;--bar:rgba(15,23,42,.13);--line:rgba(15,23,42,.08);--edge:rgba(15,23,42,.09);box-shadow:0 1px 2px rgba(15,23,42,.06),0 14px 34px rgba(15,23,42,.10)}
.card[data-card="light"] .dot{box-shadow:0 0 0 4px rgba(59,130,246,.15)}
.card[data-card="light"] .lang small{background:rgba(59,130,246,.10);color:#2563eb;padding:3px 8px;border-radius:999px;letter-spacing:.1em}
.card[data-card="light"] .time{color:#0f172a}
.card[data-card="light"] .wave i.on{background:linear-gradient(180deg,#60a5fa,#2563eb)}
.card[data-card="light"] .prog b{background:linear-gradient(90deg,#60a5fa,#2563eb)}
.card{width:min(460px,100%);padding:20px 24px 14px;border-radius:24px;background:var(--card);color:var(--cardink);border:1px solid var(--edge);
backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 50px rgba(0,0,0,.28);animation:in .3s ease-out}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;font-size:13px}
.lang{display:flex;align-items:center;gap:8px;font-family:"Hind Siliguri",Inter,sans-serif;font-weight:500}
.lang small{font:600 10px Inter,sans-serif;letter-spacing:.08em;color:var(--cardmuted);margin-left:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue);animation:b 1.5s ease-in-out infinite}
.paused .dot{animation:none;opacity:.35;box-shadow:none}
@keyframes b{50%{opacity:.35}}
.time{font:600 14px Inter,sans-serif;font-variant-numeric:tabular-nums}
.mid{display:flex;align-items:center;gap:14px;margin-top:10px}
.mic{flex:none;width:34px;height:34px;color:var(--cardink)}
.wave{flex:1;height:46px;display:flex;align-items:center;justify-content:space-between}
.wave i{display:block;width:3px;height:6px;border-radius:2px;background:var(--bar);transition:height .09s linear,background .2s}
.wave i.on{background:var(--blue)}
.prog{height:2px;border-radius:2px;background:var(--line);margin:6px 0 0 48px;overflow:hidden}
.prog b{display:block;height:100%;width:0;background:var(--blue);border-radius:2px}
.txt{margin-top:12px;font-size:13px;color:var(--cardmuted);min-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Inter,"Hind Siliguri",sans-serif}
.txt.live{color:var(--cardink);font-size:14px}
.txt span{animation:f .4s ease-out}
@keyframes f{from{opacity:0}to{opacity:1}}
.credit{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);text-align:right;font-size:10px;color:var(--cardfaint)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:600 13px Inter,sans-serif;padding:10px 18px;border-radius:999px;border:1px solid var(--muted);background:transparent;color:var(--ink);cursor:pointer}
button.p{background:var(--blue);border-color:var(--blue);color:#fff}
.note{font-size:12px;color:var(--muted);text-align:center;max-width:420px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="card" id="card" data-card="light">
  <div class="top">
    <div class="lang"><span class="dot"></span>বাংলা <small>· LIVE</small></div>
    <div class="time" id="time" aria-live="off">00:00</div>
  </div>
  <div class="mid">
    <svg class="mic" viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <rect x="11" y="5" width="9" height="16" rx="4.5" fill="#3b82f6"/>
      <path d="M7.5 17.5a8 8 0 0 0 16 0M15.5 25.5v4M11 29.5h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M23 6.5a7 7 0 0 1 3 5M25.5 3a11 11 0 0 1 4.5 8" stroke="#3b82f6" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
    </svg>
    <div class="wave" id="wave"></div>
  </div>
  <div class="prog"><b id="prog"></b></div>
  <div class="txt" id="txt" aria-live="polite">Your words will appear here as you speak…</div>
  <div class="credit">Built by Ruhul Amin · @iamruhulaamin</div>
</div>

<div class="ctl">
  <button class="p" id="pause">⏸ Pause</button>
  <button id="mic">🎤 Use my mic</button>
  <button id="theme">◐ Light / Dark</button>
</div>
<div class="note" id="note">Demo mode: the waveform is simulated. Tap “Use my mic” to react to your real voice.</div>

<script>
const N=40,wave=document.getElementById('wave'),bars=[];
for(let i=0;i<N;i++){const b=document.createElement('i');wave.appendChild(b);bars.push(b)}
const card=document.getElementById('card'),timeEl=document.getElementById('time'),prog=document.getElementById('prog'),txt=document.getElementById('txt'),note=document.getElementById('note');
const words="আজকের মিটিং সন্ধ্যা ছয়টায় হবে, সবাইকে জানিয়ে দিও। প্রজেক্টের ডেমো প্রস্তুত, শুধু শেষ কাজগুলো বাকি আছে।".split(" ");
let running=true,t=0,last=performance.now(),wi=0,shown=[],wAcc=0,levels=new Array(N).fill(0),analyser=null,data=null,phase=0;
function fmt(s){s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function level(now){
  if(analyser){analyser.getByteFrequencyData(data);let s=0;for(let i=2;i<40;i++)s+=data[i];return Math.min(1,s/38/140)}
  phase+=.06;const env=Math.max(0,Math.sin(phase*.35)*.6+.45);
  return Math.min(1,env*(.55+.45*Math.abs(Math.sin(phase*2.3)*Math.cos(phase*.9)))+Math.random()*.08)
}
function frame(now){
  const dt=(now-last)/1000;last=now;
  const lv=running?level(now):0;
  levels.shift();levels.push(lv);
  const p=(t%60)/60;
  bars.forEach((b,i)=>{
    const v=levels[i]*(.65+.35*Math.sin(i*.7+now/400));
    b.style.height=(6+Math.max(0,v)*38)+'px';
    b.classList.toggle('on',i/N<p+0.02);
  });
  if(running){
    t+=dt;timeEl.textContent=fmt(t);prog.style.width=(p*100)+'%';
    if(lv>.35){wAcc+=dt;if(wAcc>.55){wAcc=0;shown.push(words[wi++%words.length]);if(shown.length>7)shown.shift();
      txt.className='txt live';txt.innerHTML=shown.map((w,i)=>i===shown.length-1?'<span>'+w+'</span>':w).join(' ')}}
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.getElementById('pause').onclick=e=>{running=!running;card.classList.toggle('paused',!running);
  e.target.textContent=running?'⏸ Pause':'▶ Resume';last=performance.now()};
document.getElementById('theme').onclick=()=>{card.dataset.card=card.dataset.card==='dark'?'light':'dark'};
document.getElementById('mic').onclick=async()=>{
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const ac=new (window.AudioContext||window.webkitAudioContext)(),src=ac.createMediaStreamSource(st);
    analyser=ac.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.7;src.connect(analyser);
    data=new Uint8Array(analyser.frequencyBinCount);note.textContent='Live mic on: speak and watch the waveform react.'
  }catch(err){note.textContent='Mic isn’t available in this view, so the simulated demo keeps running.'}
};
</script>
</body>
</html>
